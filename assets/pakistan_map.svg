<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" id="pakistan-map">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="#0a0f0d"/>
  
  <!-- Pakistan simplified border -->
  <path d="M150,120 L250,100 L320,80 L400,70 L480,85 L520,120 L540,180 L530,250 
           L500,320 L450,380 L380,400 L300,420 L220,400 L160,350 L120,280 L130,200 Z" 
        fill="url(#mapGradient)" stroke="#134e4a" stroke-width="2" opacity="0.8"/>
  
  <!-- Province boundaries (simplified) -->
  <path d="M280,150 L320,180 L360,220 L340,280 L300,320 L260,300 L240,240 L260,180 Z" 
        fill="none" stroke="#0d9488" stroke-width="1" opacity="0.4"/>
  <path d="M400,200 L450,180 L500,200 L520,260 L500,320 L450,340 L400,300 L380,240 Z" 
        fill="none" stroke="#0d9488" stroke-width="1" opacity="0.4"/>
  <path d="M180,200 L220,180 L260,200 L280,260 L260,320 L200,340 L160,300 L160,240 Z" 
        fill="none" stroke="#0d9488" stroke-width="1" opacity="0.4"/>
  
  <!-- City markers -->
  <g class="city" data-city="Islamabad" data-x="380" data-y="140" onclick="selectCity('Islamabad')">
    <circle cx="380" cy="140" r="12" fill="#0d9488" filter="url(#glow)" class="city-glow" id="glow-Islamabad"/>
    <text x="380" y="170" text-anchor="middle" fill="#ccfbf1" font-family="DM Sans" font-size="12" font-weight="600">Islamabad</text>
    <text x="380" y="185" text-anchor="middle" fill="#0d9488" font-family="DM Sans" font-size="10" id="rev-Islamabad">₨ 0</text>
  </g>
  
  <g class="city" data-city="Lahore" data-x="480" data-y="200" onclick="selectCity('Lahore')">
    <circle cx="480" cy="200" r="14" fill="#0d9488" filter="url(#glow)" class="city-glow" id="glow-Lahore"/>
    <text x="480" y="230" text-anchor="middle" fill="#ccfbf1" font-family="DM Sans" font-size="12" font-weight="600">Lahore</text>
    <text x="480" y="245" text-anchor="middle" fill="#0d9488" font-family="DM Sans" font-size="10" id="rev-Lahore">₨ 0</text>
  </g>
  
  <g class="city" data-city="Karachi" data-x="350" data-y="350" onclick="selectCity('Karachi')">
    <circle cx="350" cy="350" r="16" fill="#0d9488" filter="url(#glow)" class="city-glow" id="glow-Karachi"/>
    <text x="350" y="380" text-anchor="middle" fill="#ccfbf1" font-family="DM Sans" font-size="12" font-weight="600">Karachi</text>
    <text x="350" y="395" text-anchor="middle" fill="#0d9488" font-family="DM Sans" font-size="10" id="rev-Karachi">₨ 0</text>
  </g>
  
  <g class="city" data-city="Multan" data-x="420" data-y="280" onclick="selectCity('Multan')">
    <circle cx="420" cy="280" r="10" fill="#0d9488" filter="url(#glow)" class="city-glow" id="glow-Multan"/>
    <text x="420" y="305" text-anchor="middle" fill="#ccfbf1" font-family="DM Sans" font-size="11" font-weight="600">Multan</text>
    <text x="420" y="320" text-anchor="middle" fill="#0d9488" font-family="DM Sans" font-size="9" id="rev-Multan">₨ 0</text>
  </g>
  
  <g class="city" data-city="Peshawar" data-x="260" data-y="160" onclick="selectCity('Peshawar')">
    <circle cx="260" cy="160" r="10" fill="#0d9488" filter="url(#glow)" class="city-glow" id="glow-Peshawar"/>
    <text x="260" y="185" text-anchor="middle" fill="#ccfbf1" font-family="DM Sans" font-size="11" font-weight="600">Peshawar</text>
    <text x="260" y="200" text-anchor="middle" fill="#0d9488" font-family="DM Sans" font-size="9" id="rev-Peshawar">₨ 0</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(600, 420)">
    <text x="0" y="0" fill="#6b7280" font-family="DM Sans" font-size="10">Revenue Intensity</text>
    <rect x="0" y="10" width="120" height="8" fill="#0a0f0d" stroke="#134e4a"/>
    <rect x="0" y="10" width="30" height="8" fill="#0d9488"/>
    <rect x="30" y="10" width="30" height="8" fill="#14b8a6"/>
    <rect x="60" y="10" width="30" height="8" fill="#2dd4bf"/>
    <rect x="90" y="10" width="30" height="8" fill="#5eead4"/>
    <text x="0" y="32" fill="#6b7280" font-family="DM Sans" font-size="9">Click city to drill down</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ccfbf1" font-family="DM Serif Display" font-size="18">PAKISTAN CLINIC NETWORK</text>
  
  <style>
    .city { cursor: pointer; }
    .city:hover circle { r: 20; transition: all 0.3s ease; }
    .city-glow { transition: all 0.5s ease; }
  </style>
  
  <script type="text/javascript">
    <![CDATA[
    function selectCity(cityName) {
      window.parent.postMessage({type: 'citySelect', city: cityName}, '*');
    }
    ]]>
  </script>
</svg>